[package]
name = "talos-nyckelpiga"
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
description = "Talos Linux KMS server backed by OpenBao transit: per-node, revocable keys for LUKS-encrypted Talos volumes"
license = "Apache-2.0"
repository = "https://github.com/backend-bunny/talos-nyckelpiga"
publish = false

[dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.3"
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
prometheus = { version = "0.14.0", default-features = false }
prost = "0.14.4"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
socket2 = "0.6"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "fs", "time", "signal", "sync"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-stream = "0.1.19"
toml = "1.1.8"
tonic = "0.14.9"
tonic-prost = "0.14.9"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
uuid = "1.29.0"
zeroize = { version = "1.9.1", features = ["serde"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[build-dependencies]
tonic-prost-build = "0.14.9"

[dev-dependencies]
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1"] }
base64 = "0.23.1"
rcgen = "0.14.10"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["process", "io-util"] }
tonic = { version = "0.14.9", features = ["tls-ring"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json"] }
