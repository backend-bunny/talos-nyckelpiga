{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nyckelpiga.serviceAccountName" . }}
  labels:
    {{- include "nyckelpiga.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The pod mounts its own projected token (audience/expiry from values).
automountServiceAccountToken: false
{{- end }}
