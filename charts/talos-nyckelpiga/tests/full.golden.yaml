# Source: talos-nyckelpiga/templates/tlsroute.yaml
# TLS passthrough: the Gateway routes the encrypted stream by SNI; the server
# terminates TLS with its own certificate.
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: kms-talos-nyckelpiga
  labels:
    helm.sh/chart: talos-nyckelpiga-VERSION
    app.kubernetes.io/name: talos-nyckelpiga
    app.kubernetes.io/instance: kms
    app.kubernetes.io/version: "VERSION"
    app.kubernetes.io/managed-by: Helm
spec:
  parentRefs:
    - name: internal
      namespace: gateway
      sectionName: tls-passthrough
  hostnames:
    - kms.example.com
  rules:
    - backendRefs:
        - name: kms-talos-nyckelpiga
          port: 4050
