# Source: talos-nyckelpiga/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: kms-talos-nyckelpiga
  labels:
    helm.sh/chart: talos-nyckelpiga-VERSION
    app.kubernetes.io/name: talos-nyckelpiga
    app.kubernetes.io/instance: kms
    app.kubernetes.io/version: "VERSION"
    app.kubernetes.io/managed-by: Helm
data:
  config.toml: |
    [server]
    listen = "0.0.0.0:4050"
    tls_cert = "/etc/talos-nyckelpiga/tls/tls.crt"
    tls_key = "/etc/talos-nyckelpiga/tls/tls.key"
    reload_interval_secs = 30
    
    [health]
    listen = "0.0.0.0:8080"
    
    [openbao]
    address = "https://openbao.openbao.svc:8200"
    ca_cert = "/etc/talos-nyckelpiga/openbao-ca/ca.crt"
    transit_mount = "transit"
    key_template = "node-{uuid}"
    associated_data = true
    request_timeout_secs = 5
    
    [openbao.auth]
    method = "kubernetes"
    mount = "k8s"
    role = "talos-nyckelpiga"
    token_path = "/var/run/secrets/talos-nyckelpiga/serviceaccount/token"
    
    [allowlist]
    path = "/etc/talos-nyckelpiga/allowlist/allowlist.toml"

