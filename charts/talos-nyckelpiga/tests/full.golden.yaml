apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kms-talos-nyckelpiga
  labels:
    helm.sh/chart: talos-nyckelpiga-VERSION
    app.kubernetes.io/name: talos-nyckelpiga
    app.kubernetes.io/instance: kms
    app.kubernetes.io/version: "VERSION"
    app.kubernetes.io/managed-by: Helm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: talos-nyckelpiga
      app.kubernetes.io/instance: kms
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: 4050
          protocol: TCP
    - ports:
        - port: 8080
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
  egress:
    - ports:
        - port: 8200
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openbao
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

