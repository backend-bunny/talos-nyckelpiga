name: release

# Publish release vX.Y.Z: ghcr.io/backend-bunny/talos-nyckelpiga:X.Y.Z and
# :sha-<short>, signed and attested keylessly, then the Helm chart
# oci://ghcr.io/backend-bunny/charts/talos-nyckelpiga:X.Y.Z pinned to that
# digest, also signed; the digests are appended to the GitHub Release.
#
# Called by release-please when its release PR is merged. Dispatch by hand
# only to retry a failed release: it re-pushes the X.Y.Z tags.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag (vX.Y.Z)
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)publish (vX.Y.Z)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-26.04
    permissions:
      contents: write # append digests to the GitHub Release
      packages: write # push to GHCR
      id-token: write # keyless cosign + provenance
      attestations: write # GitHub artifact attestation
    env:
      IMAGE: ghcr.io/backend-bunny/talos-nyckelpiga
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - name: Tag matches the version
        run: hack/check-version.sh "$TAG"
      - name: Rust checks
        run: devbox run -- hack/cargo-check.sh
      - name: Chart checks
        run: devbox run -- hack/chart-test.sh
      - name: Build (melange + apko from lockfile)
        run: devbox run -- hack/build.sh
      - name: Test image
        run: devbox run -- hack/test.sh

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish
        id: publish
        run: |
          PUBLISH_VERSION=1 devbox run -- hack/publish.sh
          echo "digest=$(cat out/digest)" >> "$GITHUB_OUTPUT"

      - name: Sign and attest (keyless cosign)
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          devbox run -- cosign sign --yes "$IMAGE@$DIGEST"
          devbox run -- cosign attest --yes --type spdxjson \
            --predicate out/sbom-x86_64.spdx.json "$IMAGE@$DIGEST"
          # Licenses and notice files of the Rust crates in the binary.
          devbox run -- cosign attest --yes \
            --type https://github.com/backend-bunny/talos-nyckelpiga/notices/v1 \
            --predicate out/notices.json "$IMAGE@$DIGEST"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Publish and sign the Helm chart
        id: chart
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$TOKEN" | devbox run -- helm registry login ghcr.io --username "$ACTOR" --password-stdin
          devbox run -- hack/chart-publish.sh
          chart_digest=$(cat out/chart-digest)
          devbox run -- cosign sign --yes "ghcr.io/backend-bunny/charts/talos-nyckelpiga@$chart_digest"
          echo "digest=$chart_digest" >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          CHART_DIGEST: ${{ steps.chart.outputs.digest }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### talos-nyckelpiga $TAG

          \`$IMAGE@$DIGEST\`

          \`\`\`sh
          cosign verify $IMAGE@$DIGEST \\
            --certificate-identity-regexp '^https://github.com/backend-bunny/talos-nyckelpiga/' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`

          Chart: \`oci://ghcr.io/backend-bunny/charts/talos-nyckelpiga\` version \`${TAG#v}\` (\`@$CHART_DIGEST\`)
          EOF

      - name: Add digests to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          CHART_DIGEST: ${{ steps.chart.outputs.digest }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/notes.md"
          cat >> "$RUNNER_TEMP/notes.md" <<EOF

          ## Artifacts

          | | Reference |
          |---|---|
          | Image | \`$IMAGE@$DIGEST\` |
          | Helm chart | \`oci://ghcr.io/backend-bunny/charts/talos-nyckelpiga\` \`${TAG#v}\` (\`@$CHART_DIGEST\`) |

          \`\`\`sh
          cosign verify $IMAGE@$DIGEST \\
            --certificate-identity-regexp '^https://github.com/backend-bunny/talos-nyckelpiga/' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          cosign verify ghcr.io/backend-bunny/charts/talos-nyckelpiga@$CHART_DIGEST \\
            --certificate-identity-regexp '^https://github.com/backend-bunny/talos-nyckelpiga/' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`
          EOF
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
