name: ci

# PR checks. No publish or OIDC permissions here, and never
# pull_request_target: PR code runs with a read-only token.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # release-please derives versions and the changelog from commit messages,
  # so PR titles (squash merges) and commit subjects (rebase merges) must be
  # Conventional Commits. release-please's own PR is exempt by construction.
  conventional-commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check PR title and commit subjects
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: hack/check-commits.sh "$BASE" "$HEAD" "$TITLE"

  rust:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - name: fmt, clippy, unit + OpenBao integration tests
        run: devbox run -- hack/cargo-check.sh

  chart:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - name: helm lint, kubeconform, golden files, config check
        run: devbox run -- hack/chart-test.sh
      - name: Package dry run
        run: IMAGE_DIGEST=sha256:$(printf '%064d' 0) DRY_RUN=1 devbox run -- hack/chart-publish.sh

  image:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - name: Build (melange + apko from lockfile)
        run: devbox run -- hack/build.sh
      - name: License notices summary
        run: |
          {
            echo "<details><summary>Rust crate licenses</summary>"
            echo
            cat out/notices.md
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Test image
        run: devbox run -- hack/test.sh
      - name: Publish dry run
        run: PUBLISH_VERSION=1 DRY_RUN=1 devbox run -- hack/publish.sh

  # Single required check for branch protection.
  ci-ok:
    needs: [conventional-commits, rust, chart, image]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - run: |
          [[ "${{ needs.conventional-commits.result }}" =~ ^(success|skipped)$ ]]
          [[ "${{ needs.rust.result }}" == success ]]
          [[ "${{ needs.chart.result }}" == success ]]
          [[ "${{ needs.image.result }}" == success ]]
